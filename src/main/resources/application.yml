spring:
  application:
    name: temporal-contract-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tce_db}
    username: ${SPRING_DATASOURCE_USERNAME:tce_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tce_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tce-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tce.domain.event.*"

  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: tce-scheduler-

logging:
  level:
    root: INFO
    com.tce: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  file:
    name: logs/tce.log

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram.http.server.requests: true
      percentiles-histogram.jvm.memory.used: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

  api-docs:
    path: /v3/api-docs

  show-actuator: true

app:
  api:
    base-url: ${APP_API_BASE_URL:/}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}